name: Test, build and package api

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

env:
  REG: ghcr.io
  NAME: ${{ github.repository }}

jobs:

  test-and-build:
    runs-on: ubuntu-20.04
    permissions:
      contents: read
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@v2

      - name: go setup
        uses: actions/setup-go@v2
        with:
          go-version: 1.23.2

      - name: verify go dependencies
        run: go mod verify

      - name: vet go
        run: go vet ./...

      - name: install golint
        run: go install golang.org/x/lint/golint@latest

      - name: run golint
        run: golint ./...

      - name: run go tests
        run: go test -race -vet=off ./...

      #removed pending further investigation: https://github.com/open-telemetry/opamp-go/pull/318
      #- name: install staticcheck
      #  run: go install honnef.co/go/tools/cmd/staticcheck@latest
      #
      #- name: run staticcheck
      #  run: staticcheck ./...
      
      - name: build api
        run: go build -o platform-take-home cmd/server/main.go

      - name: login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REG }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create tags and labels for Docker
        id: labels
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REG }}/${{ env.NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.labels.outputs.tags }}
          labels: ${{ steps.labels.outputs.labels }}
